name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['setup/**', 'feature/**', 'fix/**', 'refactor/**', 'design/**']

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check Codespaces container starts with Node and npm
        run: |
          devcontainer_image=$(node -p 'JSON.parse(require("node:fs").readFileSync(".devcontainer/devcontainer.json", "utf8")).image')
          docker run --rm --entrypoint sh "$devcontainer_image" -c 'node --version && npm --version'
      - run: npm ci
      - name: TypeScript, tests, Expo compatibility, and web export
        run: npm run validate
